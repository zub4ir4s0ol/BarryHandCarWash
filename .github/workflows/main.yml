name: Build website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
         

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        - name: install hav
          run: npm install ajv@8
  
      - name: Build website
        run: npm run build

      - name: Save finished website
        uses: actions/upload-artifact@v4
        with:
          name: barry-hand-car-wash-build
          path: frontend/build
